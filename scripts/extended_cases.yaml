# RAG_local EXTENDED eval fixtures.
#
# These cover methods that HAVE skill files but are NOT yet on the
# protocol_retrieval allow-list and have NOT been prompt-optimized yet:
#   flow_cytometry, immunofluorescence, rt_qpcr, transfection,
#   lentiviral_transduction, CRISPR_knockout (≠ CRISPR-Cas9!), cell_culture,
#   EMSA, ELISA.
#
# These exist so we can:
#   1. Track PubMed/retrieval-general metrics (Recall@K, MRR, faithfulness,
#      coverage) on a broader query distribution
#   2. Have ready-to-use fixtures the moment Member B writes risk_registry
#      content for any of these methods
#
# By design these OMIT expected_skill_patterns since the expected skill
# file isn't on the allow-list — so the boolean skill-hit check would
# always fail without saying anything useful.
#
# Default harness run (`python scripts/eval_harness.py`) reads
# core_cases.yaml. To also include this file, pass:
#   --cases-extra scripts/extended_cases.yaml
#
# Schema reference: see header of scripts/core_cases.yaml.

cases:

  - id: fc_gating_pd_l1
    tier: extended
    bucket: semantic
    query: "flow cytometry PD-L1 gating strategy with FMO controls"
    expected_pmid_keywords:
      - ["pd-l1", "flow cytometry"]
      - ["fmo", "gating"]
    instruction_regex:
      - "critical parameters"
    require_citations: true

  - id: fc_compensation
    tier: extended
